name: SHAMARA Sign APK

on:
  push:
    branches:
      - shamara/android-mcp
    paths:
      - .github/workflows/shamara-sign.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  sign-arm64:
    name: Sign SHAMARA arm64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download successful unsigned arm64 artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ARTIFACT_ID: '9743458117'
        run: |
          set -euo pipefail
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/artifacts/$ARTIFACT_ID/zip" \
            -o artifact.zip
          mkdir unsigned
          unzip -q artifact.zip -d unsigned
          APK="$(find unsigned -name '*.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" unsigned.apk

      - name: Resolve Android build tools
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "build-tools;36.0.0"
          echo "BUILD_TOOLS=$SDK/build-tools/36.0.0" >> "$GITHUB_ENV"

      - name: Generate CI signing key and sign APK
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/shamara-ci.jks" \
            -storepass shamara-ci-2026 \
            -keypass shamara-ci-2026 \
            -alias shamara-ci \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=SHAMARA CI, OU=Android, O=SHAMARA, L=CI, ST=CI, C=ES"
          "$BUILD_TOOLS/zipalign" -p -f 4 unsigned.apk aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/shamara-ci.jks" \
            --ks-pass pass:shamara-ci-2026 \
            --key-pass pass:shamara-ci-2026 \
            --ks-key-alias shamara-ci \
            --out SHAMARA-Bridge-arm64-v8a-signed.apk aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs SHAMARA-Bridge-arm64-v8a-signed.apk
          sha256sum SHAMARA-Bridge-arm64-v8a-signed.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: shamara-bridge-arm64-v8a-signed
          path: SHAMARA-Bridge-arm64-v8a-signed.apk
          if-no-files-found: error
          retention-days: 30
