name: SHAMARA Persist Bridge Result

on:
  push:
    branches:
      - shamara/android-mcp
    paths:
      - '.github/workflows/shamara-persist-result.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: shamara/android-mcp

      - name: Persist SHAMARA execution result
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/models/AppController.cpp')
          s = p.read_text()

          old_ctor = '''    m_shamaraLastCommandId = QSettings().value(QStringLiteral("shamara/lastCommandId")).toString();
    m_shamaraBridgeStatus = tr("Ready");'''
          new_ctor = '''    m_shamaraLastCommandId = QSettings().value(QStringLiteral("shamara/lastCommandId")).toString();
    m_shamaraBridgeStatus = QSettings().value(QStringLiteral("shamara/lastResult")).toString();
    if (m_shamaraBridgeStatus.isEmpty())
        m_shamaraBridgeStatus = tr("Ready");'''

          old_repeat = '''        if (id == m_shamaraLastCommandId) {
            finish(tr("Connected · last command %1").arg(id));
            return;
        }'''
          new_repeat = '''        if (id == m_shamaraLastCommandId) {
            const QString persistedResult = QSettings().value(QStringLiteral("shamara/lastResult")).toString();
            finish(persistedResult.isEmpty()
                       ? tr("Connected · last command %1").arg(id)
                       : persistedResult);
            return;
        }'''

          old_finish = '''        m_shamaraLastCommandId = id;
        QSettings().setValue(QStringLiteral("shamara/lastCommandId"), id);
        finish(failed ? tr("SHAMARA command %1 returned an error").arg(id)
                      : tr("SHAMARA command %1 executed").arg(id));'''
          new_finish = '''        m_shamaraLastCommandId = id;
        const QString result = failed ? tr("SHAMARA command %1 returned an error").arg(id)
                                      : tr("SHAMARA command %1 executed").arg(id);
        QSettings settings;
        settings.setValue(QStringLiteral("shamara/lastCommandId"), id);
        settings.setValue(QStringLiteral("shamara/lastResult"), result);
        finish(result);'''

          for old, new, label in [
              (old_ctor, new_ctor, 'constructor'),
              (old_repeat, new_repeat, 'repeat-status'),
              (old_finish, new_finish, 'result-persist'),
          ]:
              if new in s:
                  continue
              if old not in s:
                  raise SystemExit(f'Expected SHAMARA block not found: {label}')
              s = s.replace(old, new, 1)

          p.write_text(s)

      - name: Commit bridge result persistence
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/models/AppController.cpp
          git commit -m "shamara: persist bridge command result"
          git push origin HEAD:shamara/android-mcp
