name: SHAMARA Sync Translations

on:
  push:
    branches:
      - shamara/android-mcp
    paths:
      - '.github/workflows/shamara-sync-translations.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      QT_VERSION: "6.10.3"
      FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.deps
      FFMPEG_REPO: "CutWire-Studios/FFmpeg-Builds"
      FFMPEG_TAG: "n7.1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: shamara/android-mcp
      - name: Install native configure dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure-cli*
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y -o Acquire::Retries=3 \
            build-essential ninja-build pkg-config git \
            libgl1-mesa-dev libegl1-mesa-dev libglib2.0-dev libdbus-1-dev \
            libzstd-dev libssl-dev libsoundtouch-dev libpulse-dev libasound2-dev \
            libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libx11-xcb-dev libxext-dev libxfixes-dev libxi-dev libxrender-dev \
            libxcb1-dev libxcb-glx0-dev libxcb-keysyms1-dev libxcb-image0-dev libxcb-shm0-dev \
            libxcb-icccm4-dev libxcb-sync-dev libxcb-xfixes0-dev libxcb-shape0-dev \
            libxcb-randr0-dev libxcb-render-util0-dev libxcb-xinerama0-dev libxcb-cursor-dev
      - name: Install Qt with LinguistTools
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtmultimedia qtimageformats
          cache: true
          add-tools-to-path: true
      - name: Fetch pinned FFmpeg
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/.deps/ffmpeg"
          curl -fsSL "https://github.com/${FFMPEG_REPO}/releases/download/${FFMPEG_TAG}/ffmpeg-${FFMPEG_TAG}-linux64-gpl-shared.tar.xz" \
            | tar -xJf - --strip-components=1 -C "${GITHUB_WORKSPACE}/.deps/ffmpeg"
      - name: Configure
        run: |
          export PKG_CONFIG_PATH="${GITHUB_WORKSPACE}/.deps/ffmpeg/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR};${GITHUB_WORKSPACE}/.deps/ffmpeg" \
            -DFETCHCONTENT_BASE_DIR="${FETCHCONTENT_BASE_DIR}" \
            -DDRIFT_BUNDLE_ONNXRUNTIME=OFF \
            -DDRIFT_AUTO_UPDATE_TRANSLATIONS=OFF
      - name: Refresh translation catalogs
        run: cmake --build build --target update_translations
      - name: Commit refreshed catalogs
        run: |
          if git diff --quiet -- i18n; then
            echo "Translation catalogs already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add i18n/*.ts
          git commit -m "i18n: sync SHAMARA bridge strings"
          git push origin HEAD:shamara/android-mcp
